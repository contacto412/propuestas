<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Azafrán · Propuestas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&display=swap">
<style>
:root { --bg:#F5F7FA; --ink:#131A23; --soft:#5A6773; --brand:#0D65D4; }
@media (prefers-color-scheme:dark){ :root{ --bg:#0F151D; --ink:#E9EEF4; --soft:#9DAAB8; --brand:#6FA9F5; } }
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;
 background:var(--bg);color:var(--ink);
 font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:26rem;text-align:center;display:flex;flex-direction:column;gap:1.1rem}
h1{margin:0;font-size:2.1rem;font-weight:800;letter-spacing:-0.045em;line-height:1}
h1 span{color:var(--brand)}
hr{width:2.2rem;height:3px;border:0;background:var(--brand);margin:0 auto}
p{margin:0;font-size:0.98rem;font-weight:500;line-height:1.6;color:var(--soft)}
a{color:var(--brand);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
a:hover{opacity:.75}
  
</style>
</head>
<body>
<main>
<h1>azafran<span>.</span></h1>
<hr>
<p>Aquí publicamos las propuestas que preparamos para cada marca. Si llegaste hasta acá sin un enlace, seguramente buscabas <a href="https://www.agencia-azafran.com">agencia-azafran.com</a>.</p>
</main>
</body>
</html>
